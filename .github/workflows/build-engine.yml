name: Build Godot master HEAD

on:
  workflow_dispatch:
    inputs:
      godot_repository:
        description: Godot source repository (owner/repo; use a fork for upstream work)
        type: string
        default: godotengine/godot
        required: true
      upstream_ref:
        description: Upstream branch or tag (master resolves to HEAD when run)
        type: string
        default: master
        required: true
      build_linux:
        description: Build Linux editor
        type: boolean
        default: true
      build_windows:
        description: Build Windows editor
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-godot.yml
    with:
      godot_repository: ${{ inputs.godot_repository }}
      upstream_ref: ${{ inputs.upstream_ref }}
      build_linux: ${{ inputs.build_linux }}
      build_windows: ${{ inputs.build_windows }}

  smoke-linux:
    name: Godauldron smoke (Linux)
    needs: build
    if: inputs.build_linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-linux-editor
          path: .engine
      - name: Import and test Godauldron
        run: |
          chmod +x .engine/godot
          .engine/godot --version
          .engine/godot --headless --path . --editor --import --quit
          .engine/godot --headless --path . --script res://tests/runtime_smoke.gd

  smoke-windows:
    name: Godauldron smoke (Windows)
    needs: build
    if: inputs.build_windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: godot-windows-editor
          path: .engine
      - name: Import and test Godauldron
        shell: pwsh
        run: |
          .\.engine\godot.exe --version
          .\.engine\godot.exe --headless --path . --editor --import --quit
          .\.engine\godot.exe --headless --path . --script res://tests/runtime_smoke.gd
