name: Build Godot source (reusable)

on:
  workflow_call:
    inputs:
      godot_repository:
        description: Public Godot source repository (owner/repo)
        type: string
        required: false
        default: godotengine/godot
      upstream_ref:
        description: Branch, tag, or commit to resolve once for the entire build
        type: string
        required: false
        default: master
      build_linux:
        type: boolean
        required: false
        default: true
      build_windows:
        type: boolean
        required: false
        default: true
    outputs:
      resolved_revision:
        description: Exact upstream commit built across all selected platforms
        value: ${{ jobs.resolve.outputs.revision }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Godot source revision
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - name: Resolve upstream ref
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.upstream_ref }}
          path: _godot_resolve
          fetch-depth: 1
          persist-credentials: false
      - name: Record checked-out revision
        id: revision
        shell: bash
        run: |
          revision="$(git -C _godot_resolve rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ inputs.godot_repository }} @ ${{ inputs.upstream_ref }}"

  linux-editor:
    name: Godot Linux editor
    if: inputs.build_linux
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Fetch Godot source at resolved revision
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ needs.resolve.outputs.revision }}
          path: _engine_source
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config build-essential libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libwayland-bin libasound2-dev libpulse-dev libudev-dev libgl1-mesa-dev
          python -m pip install scons
      - name: Install AccessKit
        working-directory: _engine_source
        run: python misc/scripts/install_accesskit.py
      - name: Build editor
        working-directory: _engine_source
        run: scons platform=linuxbsd target=editor debug_symbols=no accesskit=yes -j 2
      - name: Stage editor and GDExtension development API
        shell: bash
        env:
          GODOT_REPOSITORY: ${{ inputs.godot_repository }}
          GODOT_REF: ${{ inputs.upstream_ref }}
          GODOT_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          mkdir -p _engine_dist
          cp _engine_source/bin/godot.linuxbsd.editor.x86_64 _engine_dist/godot
          chmod +x _engine_dist/godot
          printf 'repository=%s\nrequested_ref=%s\nresolved_revision=%s\n' "$GODOT_REPOSITORY" "$GODOT_REF" "$GODOT_REVISION" > _engine_dist/source.txt
          cd _engine_dist
          ./godot --version
          ./godot --headless --dump-extension-api
          ./godot --headless --dump-gdextension-interface
          test -s extension_api.json
          test -s gdextension_interface.h
      - uses: actions/upload-artifact@v4
        with:
          name: godot-linux-editor
          path: _engine_dist/
          if-no-files-found: error
          retention-days: 14

  windows-editor:
    name: Godot Windows editor
    if: inputs.build_windows
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Fetch Godot source at resolved revision
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ needs.resolve.outputs.revision }}
          path: _engine_source
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SCons
        run: python -m pip install scons
      - name: Install Direct3D 12 SDK, ANGLE and AccessKit
        working-directory: _engine_source
        run: |
          python misc/scripts/install_d3d12_sdk_windows.py
          python misc/scripts/install_angle.py
          python misc/scripts/install_accesskit.py
      - name: Build editor (Vulkan and D3D12)
        working-directory: _engine_source
        run: scons platform=windows target=editor debug_symbols=no windows_subsystem=console d3d12=yes angle=yes accesskit=yes -j 2
      - name: Stage editor and GDExtension development API
        shell: pwsh
        env:
          GODOT_REPOSITORY: ${{ inputs.godot_repository }}
          GODOT_REF: ${{ inputs.upstream_ref }}
          GODOT_REVISION: ${{ needs.resolve.outputs.revision }}
        run: |
          New-Item -ItemType Directory -Force -Path _engine_dist | Out-Null
          Copy-Item "_engine_source\bin\godot.windows.editor.x86_64.exe" "_engine_dist\godot.exe"
          @(
            "repository=$env:GODOT_REPOSITORY"
            "requested_ref=$env:GODOT_REF"
            "resolved_revision=$env:GODOT_REVISION"
          ) | Set-Content -Path "_engine_dist\source.txt" -Encoding utf8
          Push-Location _engine_dist
          try {
            .\godot.exe --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\godot.exe --headless --dump-extension-api
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\godot.exe --headless --dump-gdextension-interface
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (!(Test-Path extension_api.json)) { throw "Missing extension_api.json" }
            if (!(Test-Path gdextension_interface.h)) { throw "Missing gdextension_interface.h" }
          } finally {
            Pop-Location
          }
      - uses: actions/upload-artifact@v4
        with:
          name: godot-windows-editor
          path: _engine_dist/
          if-no-files-found: error
          retention-days: 14
