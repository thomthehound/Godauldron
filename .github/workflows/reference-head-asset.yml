name: Acquire CC0 reference head

# One-off asset import; not a runtime/build-time network requirement.
on:
  push:
    branches: [feature/loxfx-stage-refinement]
    paths:
      - scripts/acquire_reference_head.py
      - .github/workflows/reference-head-asset.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and structurally validate CC0 GLB
        run: python scripts/acquire_reference_head.py
      - name: Commit bundled reference asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/showcase/makehuman_reference.glb
          if ! git diff --cached --quiet; then
            git commit -m "Bundle CC0 MakeHuman reference glTF for portrait staging"
            git push origin HEAD:${{ github.ref_name }}
          fi
