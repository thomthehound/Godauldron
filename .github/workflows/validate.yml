name: Validate laboratory

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Feature branches validate via pull_request or manual dispatch, not a
# redundant push workflow. Only one run per branch consumes build capacity.
# Pushes to main always retain complete, uncancelled CI.
concurrency:
  group: validate-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

  manifest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifests
        run: python tools/validate_manifests.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify package setup skips already-installed dependencies
        run: bash scripts/ci_install_ubuntu_packages.sh bash

  godot-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        track: [edge, godot4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Godot for selected track
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.track }}" = "godot4" ]; then
            python tools/fetch_preview.py --major 4
          else
            python tools/fetch_preview.py
          fi
      - name: Import project
        run: .engine/godot --headless --path . --editor --import --quit
      - name: Validate CC0 reference glTF structure
        run: python tools/inspect_reference_asset.py
      - name: Verify scene and script loading
        run: .engine/godot --headless --path . --quit-after 15
      - name: Verify fixed-step run and exported results
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/runtime_smoke.gd
      - name: Verify campaigns and comparisons
        run: .engine/godot --headless --path . --script res://tests/campaign_smoke.gd
      - name: Verify host observability statistics and provider GPU provenance
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/observability_smoke.gd
      - name: Verify resolved native-provider queue timelines and CPU wait isolation
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/provider_gpu_timeline_smoke.gd
      - name: Verify bounded messages console and post-run provider diagnostics
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/diagnostics_console_smoke.gd
      - name: Verify renderer viewport timing and hardware provenance
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/engine_viewport_telemetry_smoke.gd
      - name: Verify campaign statistics and optional guard limits
        run: .engine/godot --headless --path . --script res://tests/analysis_smoke.gd
      - name: Verify camera navigation and inspection overlays
        run: .engine/godot --headless --path . --script res://tests/inspection_smoke.gd
      - name: Verify free-fly camera and capability-aware render diagnostics
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/free_fly_diagnostics_smoke.gd
      - name: Verify scene camera bookmarks and pixel mapping
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/inspection_views_smoke.gd
      - name: Verify authored fixed-step camera tracks and timeline integration
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/camera_tracks_smoke.gd
      - name: Verify technical gallery imports, previews, and report isolation
        run: .engine/godot --headless --path . --script res://tests/gallery_smoke.gd
      - name: Verify provider runtime capability controls, real scene effects and run isolation
        run: .engine/godot --headless --path . --script res://tests/provider_runtime_controls_smoke.gd
      - name: Verify pipeline lifecycle provenance and idle-only diagnostics
        run: .engine/godot --headless --path . --script res://tests/pipeline_diagnostics_smoke.gd
      - name: Verify graphics ownership, presets and image persistence
        run: .engine/godot --headless --path . --script res://tests/capture_graphics_smoke.gd
      - name: Verify camera-only exposure grading and provider Environment preservation
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/environment_inspection_smoke.gd
      - name: Verify renderer buffer capability gates and numeric preview separation
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/render_buffer_probe_smoke.gd
      - name: Verify GPU timestamp interval validation and report persistence
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/gpu_stage_probe_smoke.gd
      - name: Verify true float OpenEXR transport and explicit SDR capture rejection
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/hdr_exr_smoke.gd
      - name: Verify saved image comparisons and visual diff UI
        run: .engine/godot --headless --path . --script res://tests/visual_comparison_smoke.gd
      - name: Verify native package isolation and deterministic showcase stages
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/loxfx_onboarding_smoke.gd
      - name: Verify searchable experiments and saved configurations
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/session_smoke.gd
      - name: Verify fixed-step sequence writer, provenance and host exclusion
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --script res://tests/frame_sequence_smoke.gd

  windows-native-timeline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download current Godot 4 for Windows (console)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/fetch_preview.py --major 4 --platform win64.exe
      - name: Import project on Windows
        run: .\.engine\godot_console.exe --headless --path . --editor --import --quit
      - name: Verify provider GPU queue timeline and lifecycle on Windows
        run: .\.engine\godot_console.exe --headless --path . --script res://tests/provider_gpu_timeline_smoke.gd
      - name: Verify legacy provider timing remains compatible
        run: .\.engine\godot_console.exe --headless --path . --script res://tests/observability_smoke.gd

  native-vulkan-device:
    # Executed on PRs, manual dispatch and main. Never silently skipped.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_VK_DEVICE_SELECT: "10005:0000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore cached native Vulkan Ubuntu packages
        uses: actions/cache@v4
        with:
          path: .ci-apt-archives
          key: ubuntu24-native-vulkan-apt-v1-${{ hashFiles('scripts/ci_install_ubuntu_packages.sh') }}
          restore-keys: ubuntu24-native-vulkan-apt-
      - name: Install native Vulkan and shader build dependencies
        run: |
          bash scripts/ci_install_ubuntu_packages.sh cmake ninja-build build-essential libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools xvfb
          ICD="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -iname '*lvp*.json' -print -quit 2>/dev/null)"
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
      - name: Download Godot 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/fetch_preview.py --major 4
      - name: Restore C++ bindings build cache
        uses: actions/cache@v4
        with:
          path: .native-build
          key: native-godotcpp-${{ runner.os }}-v10-godot47-${{ hashFiles('native/vulkan_provider/CMakeLists.txt') }}
          restore-keys: native-godotcpp-${{ runner.os }}-v10-godot47-
      - name: Compile independent C++23 native Vulkan extension
        run: |
          cmake -S native/vulkan_provider -B .native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG"
          cmake --build .native-build --parallel 3
          LIB="$(find .native-build -type f -name 'libgodauldron_native_vulkan_provider.so' -print -quit)"
          test -n "$LIB"
          python native/vulkan_provider/install_package.py "$LIB"
      - name: Verify pinned native shader is identical to compiled GLSL
        run: python native/vulkan_provider/pinned_spirv.py verify native/vulkan_provider/embedded/persistent_image.spv.b64 .native-build/generated/persistent_image.spv
      - name: Validate installed native package
        run: |
          python tools/validate_manifests.py
          timeout --signal=TERM --kill-after=5s 120s .engine/godot --headless --path . --editor --import --quit
      - name: Validate native Vulkan queue work against Vulkan API rules
        run: |
          set -o pipefail
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation timeout --signal=TERM --kill-after=5s 150s .engine/godot --headless --path . --script res://tests/native_vulkan_provider_smoke.gd 2>&1 | tee native-vulkan-validation.log
          if grep -E 'VUID-|Validation Error' native-vulkan-validation.log; then
            echo "Vulkan validation found invalid native GPU commands"
            exit 1
          fi
      - name: Verify real native Vulkan compute/copy, GPU queries and fence completion alongside Forward+
        run: timeout --signal=TERM --kill-after=5s 150s xvfb-run -a .engine/godot --path . --rendering-method forward_plus --script res://tests/native_vulkan_provider_smoke.gd
      - name: Verify compiled GLSL native pipeline hot reload and fence-safe rollback
        run: |
          set -o pipefail
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation timeout --signal=TERM --kill-after=5s 180s xvfb-run -a .engine/godot --path . --rendering-method forward_plus --script res://tests/native_shader_hot_reload_smoke.gd 2>&1 | tee native-shader-reload-validation.log
          if grep -E 'VUID-|Validation Error' native-shader-reload-validation.log; then
            echo "Native shader reload violated Vulkan validation"
            exit 1
          fi
      - name: Verify native GDExtension on the actual Godot VkDevice and GPU storage buffer
        run: |
          set -o pipefail
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation timeout --signal=TERM --kill-after=5s 150s xvfb-run -a .engine/godot --path . --rendering-method forward_plus --script res://tests/native_vulkan_shared_device_smoke.gd 2>&1 | tee native-godot-shared-device-validation.log
          if grep -E 'VUID-|Validation Error' native-godot-shared-device-validation.log; then
            echo "Native shared-device work violated Vulkan validation"
            exit 1
          fi
      - name: Verify native C++ shader and compute dispatch recorded through Godot RD
        run: |
          set -o pipefail
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation timeout --signal=TERM --kill-after=5s 150s xvfb-run -a .engine/godot --path . --rendering-method forward_plus --script res://tests/native_vulkan_authored_compute_smoke.gd 2>&1 | tee native-godot-authored-dispatch-validation.log
          if grep -E 'VUID-|Validation Error' native-godot-authored-dispatch-validation.log; then
            echo "Native-authored Godot RD compute violated Vulkan validation"
            exit 1
          fi
      - name: Verify persistent native shader resources, GPU barriers and completion-safe reuse
        run: |
          set -o pipefail
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation timeout --signal=TERM --kill-after=5s 180s xvfb-run -a .engine/godot --path . --rendering-method forward_plus --script res://tests/native_rd_persistent_workload_smoke.gd 2>&1 | tee native-persistent-gpu-validation.log
          if grep -E 'VUID-|Validation Error' native-persistent-gpu-validation.log; then
            echo "Native workload reuse violated Vulkan validation"
            exit 1
          fi
      - name: Verify independent native GPU submissions and concurrent readbacks
        run: |
          set -o pipefail
          VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation timeout --signal=TERM --kill-after=5s 180s xvfb-run -a .engine/godot --path . --rendering-method forward_plus --script res://tests/native_rd_inflight_smoke.gd 2>&1 | tee native-inflight-validation.log
          if grep -E 'VUID-|Validation Error' native-inflight-validation.log; then
            echo "Native in-flight ring violated Vulkan validation"
            exit 1
          fi

  windows-d3d12-native-rd:
    runs-on: windows-latest
    # Independent of Ubuntu package installation. The checked-in SPIR-V
    # is byte-compared against freshly compiled GLSL by native-vulkan-device.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Godot 4 for Windows (console and GUI binaries)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/fetch_preview.py --major 4 --platform win64.exe
      - name: Identify MSVC toolchain
        id: msvc
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\\Installer\\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "Visual Studio Installer discovery tool not found" }
          $version = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion).Trim()
          if (-not $version) { throw "MSVC C++ compiler toolchain is unavailable" }
          $major = [int]($version.Split('.')[0])
          $generator = switch ($major) {
            18 { "Visual Studio 18 2026" }
            17 { "Visual Studio 17 2022" }
            default { throw "Unsupported installed Visual Studio version: $version" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "generator=$generator" >> $env:GITHUB_OUTPUT
      - name: Cache native RD Windows build
        uses: actions/cache@v4
        with:
          path: .native-rd-windows-build
          key: native-rd-windows-${{ runner.os }}-${{ runner.arch }}-${{ steps.msvc.outputs.version }}-${{ hashFiles('native/vulkan_provider/CMakeLists.txt') }}
      - name: Configure and compile C++23 native RD-only extension
        shell: pwsh
        run: |
          Write-Host "Building native C++23 extension with ${{ steps.msvc.outputs.generator }} (${{ steps.msvc.outputs.version }})"
          cmake -S native/vulkan_provider -B .native-rd-windows-build -G "${{ steps.msvc.outputs.generator }}" -A x64 -DGODAULDRON_RD_ONLY=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build .native-rd-windows-build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $binary = Get-ChildItem .native-rd-windows-build -Recurse -Filter godauldron_native_rd_workload.dll | Select-Object -First 1
          if (-not $binary) { throw "C++23 native RD-only GDExtension was not built" }
          python native/rd_windows/install_package.py $binary.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Upgrading an installed native package must also refresh its
          # compositor script, rather than leaving an old API behind.
          python native/rd_windows/install_package.py $binary.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import Godot project with RD-only native Windows package
        run: .\.engine\godot_console.exe --headless --path . --editor --import --quit
      - name: Verify real D3D12 WARP compute, barriers, persistent resources and completion
        shell: pwsh
        run: |
          & .\.engine\godot_console.exe --path . --rendering-method forward_plus --rendering-driver d3d12 --gpu-index 0 --script res://tests/native_rd_persistent_workload_smoke.gd
          if ($LASTEXITCODE -ne 0) { throw "D3D12 WARP native compute test failed; never count a fallback renderer as coverage" }
      - name: Verify distinct D3D12 GPU slots and overlapping asynchronous readbacks
        shell: pwsh
        run: |
          & .\.engine\godot_console.exe --path . --rendering-method forward_plus --rendering-driver d3d12 --gpu-index 0 --script res://tests/native_rd_inflight_smoke.gd
          if ($LASTEXITCODE -ne 0) { throw "D3D12 native RD in-flight ring test failed" }
      - name: Verify autonomous D3D12 sustained stream with measured host overhead
        shell: pwsh
        run: |
          & .\.engine\godot_console.exe --path . --rendering-method forward_plus --rendering-driver d3d12 --gpu-index 0 --script res://tests/native_rd_stream_profile.gd -- --mode software --width 13 --height 9 --slots 3 --warmup 3 --samples 12 --passes 3 --resident_batches 2 --output res://native_rd_warp_stream.json
          if ($LASTEXITCODE -ne 0) { throw "D3D12 WARP sustained native RD workload failed" }
          python tools/validate_native_rd_stream_profile.py native_rd_warp_stream.json --mode software
          if ($LASTEXITCODE -ne 0) { throw "Sustained native RD throughput evidence failed validation" }
      - name: Verify checkpointed GPU lists with fewer D3D12 readbacks
        shell: pwsh
        run: |
          & .\.engine\godot_console.exe --path . --rendering-method forward_plus --rendering-driver d3d12 --gpu-index 0 --script res://tests/native_rd_stream_profile.gd -- --mode software --width 13 --height 9 --slots 3 --warmup 12 --samples 12 --passes 3 --resident_batches 2 --readback_interval 4 --output res://native_rd_warp_checkpoint.json
          if ($LASTEXITCODE -ne 0) { throw "D3D12 checkpoint workload failed" }
          python tools/validate_native_rd_stream_profile.py native_rd_warp_checkpoint.json --mode software
          if ($LASTEXITCODE -ne 0) { throw "D3D12 checkpoint accounting or provenance invalid" }
      - name: Verify on-device profiler collects WARP GPU execution and distinct timing domains
        shell: pwsh
        run: |
          & .\.engine\godot_console.exe --path . --rendering-method forward_plus --rendering-driver d3d12 --gpu-index 0 --script res://tests/native_rd_hardware_profile.gd -- --mode software --width 13 --height 9 --warmup 1 --samples 2 --passes 3 --output res://native_rd_warp_profile.json
          if ($LASTEXITCODE -ne 0) { throw "Native RD GPU profiler software-runtime acceptance failed" }
          python tools/validate_native_rd_profile.py native_rd_warp_profile.json --mode software
          if ($LASTEXITCODE -ne 0) { throw "Profiler GPU/host provenance report validation failed" }
          python tools/analyze_native_rd_profile.py native_rd_warp_profile.json --json-output native_rd_warp_analysis.json --csv-output native_rd_warp_batches.csv
          if ($LASTEXITCODE -ne 0) { throw "Profiler hardware/host distribution analysis failed" }
          & .\.engine\godot_console.exe --path . --rendering-method forward_plus --rendering-driver d3d12 --gpu-index 0 --script res://tests/native_rd_hardware_profile.gd -- --mode software --width 13 --height 9 --warmup 1 --samples 2 --passes 3 --resident_batches 4 --output res://native_rd_warp_series.json
          if ($LASTEXITCODE -ne 0) { throw "Native RD resident-series GPU execution failed" }
          python tools/validate_native_rd_profile.py native_rd_warp_series.json --mode software
          if ($LASTEXITCODE -ne 0) { throw "Resident-series lifecycle or dispatch validation failed" }
          python tools/analyze_native_rd_profile.py native_rd_warp_series.json --json-output native_rd_warp_series.analysis.json
          if ($LASTEXITCODE -ne 0) { throw "Resident-series performance attribution failed" }
          if (!(Test-Path native_rd_warp_analysis.json) -or !(Test-Path native_rd_warp_batches.csv)) {
            throw "Native RD profiling outputs missing"
          }

  forward-hdr-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_VK_DEVICE_SELECT: "10005:0000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore cached Forward+ Ubuntu packages
        uses: actions/cache@v4
        with:
          path: .ci-apt-archives
          key: ubuntu24-forward-hdr-apt-v1-${{ hashFiles('scripts/ci_install_ubuntu_packages.sh') }}
          restore-keys: ubuntu24-forward-hdr-apt-
      - name: Install Vulkan software adapter and display
        run: |
          bash scripts/ci_install_ubuntu_packages.sh mesa-vulkan-drivers xvfb
          ICD="$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -iname '*lvp*.json' -print -quit 2>/dev/null)"
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
      - name: Download Godot 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/fetch_preview.py --major 4
      - name: Import assets
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --editor --import --quit
      - name: Verify actual Forward+ scene-linear HDR output from emitted radiance
        run: timeout --signal=TERM --kill-after=5s 120s xvfb-run -a .engine/godot --path . --rendering-method forward_plus --script res://tests/hdr_forward_graphics_smoke.gd
      - name: Verify actual Forward+ depth, normal and motion-vector readbacks
        run: timeout --signal=TERM --kill-after=5s 150s xvfb-run -a .engine/godot --path . --rendering-method forward_plus --script res://tests/native_render_buffers_forward_smoke.gd
      - name: Verify real compositor stage GPU timestamp intervals
        run: timeout --signal=TERM --kill-after=5s 150s xvfb-run -a .engine/godot --path . --rendering-method forward_plus --script res://tests/gpu_stage_forward_graphics_smoke.gd

  portrait-visual-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Godot 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/fetch_preview.py --major 4
      - name: Ensure virtual display and software OpenGL
        run: |
          bash scripts/ci_install_ubuntu_packages.sh xvfb libgl1-mesa-dri
          command -v xvfb-run >/dev/null
      - name: Import assets
        run: timeout --signal=TERM --kill-after=5s 90s .engine/godot --headless --path . --editor --import --quit
      - name: Capture neutral scalp head
        run: timeout --signal=TERM --kill-after=5s 90s xvfb-run -a .engine/godot --path . --rendering-method gl_compatibility --script res://tests/reference_portrait_capture.gd
      - name: Verify production fixed-step PNG sequence export
        run: timeout --signal=TERM --kill-after=5s 90s xvfb-run -a .engine/godot --path . --rendering-method gl_compatibility --script res://tests/frame_sequence_graphics_smoke.gd
      - name: Verify one-shot graphical pixel inspection and benchmark exclusion
        run: timeout --signal=TERM --kill-after=5s 90s xvfb-run -a .engine/godot --path . --rendering-method gl_compatibility --script res://tests/pixel_inspection_graphics_smoke.gd
      - name: Verify graded camera exposure across rendered PNG stills and sequences
        run: timeout --signal=TERM --kill-after=5s 90s xvfb-run -a .engine/godot --path . --rendering-method gl_compatibility --script res://tests/environment_graphics_smoke.gd
      - name: Verify actual graphical viewport renderer CPU/GPU reporting
        run: timeout --signal=TERM --kill-after=5s 90s xvfb-run -a .engine/godot --path . --rendering-method gl_compatibility --script res://tests/engine_viewport_graphics_smoke.gd
      - name: Preserve full-size visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-portrait-captures
          path: visual-artifacts/*.jpg
          if-no-files-found: warn
