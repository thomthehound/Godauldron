name: Validate laboratory

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

  manifest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifests
        run: python tools/validate_manifests.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  godot-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        track: [edge, godot4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Godot for selected track
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ matrix.track }}" = "godot4" ]; then
            python tools/fetch_preview.py --major 4
          else
            python tools/fetch_preview.py
          fi
      - name: Import project
        run: .engine/godot --headless --path . --editor --import --quit
      - name: Verify scene and script loading
        run: .engine/godot --headless --path . --quit-after 15
      - name: Verify fixed-step run and exported results
        run: .engine/godot --headless --path . --script res://tests/runtime_smoke.gd
